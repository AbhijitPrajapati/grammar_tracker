services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: grammar_tracker_e2e
      POSTGRES_PASSWORD: grammar_tracker_e2e
      POSTGRES_DB: grammar_tracker_e2e
    volumes:
      - ./frontend/database/schema.sql:/docker-entrypoint-initdb.d/001-grammar-tracker-schema.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U grammar_tracker_e2e -d grammar_tracker_e2e",
        ]
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    build: ./frontend
    environment:
      DATABASE_URL: postgresql://grammar_tracker_e2e:grammar_tracker_e2e@postgres:5432/grammar_tracker_e2e
      DATABASE_POOL_MAX: 5
      JWT_SECRET: e2e-only-secret-that-is-not-used-outside-tests
      SESSION_TTL_MINUTES: 60
      ANALYZER_MODE: deterministic
      ANALYSIS_MINUTE_LIMIT: 3
      ANALYSIS_DAY_LIMIT: 20
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:?Set UPSTASH_REDIS_REST_URL before running E2E tests}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:?Set UPSTASH_REDIS_REST_TOKEN before running E2E tests}
      BLOB_STORE_ID: ${BLOB_STORE_ID:?Set BLOB_STORE_ID before running E2E tests}
      VERCEL_OIDC_TOKEN: ${VERCEL_OIDC_TOKEN:?Set VERCEL_OIDC_TOKEN before running E2E tests}
      BLOB_WEBHOOK_PUBLIC_KEY: ${BLOB_WEBHOOK_PUBLIC_KEY:?Set BLOB_WEBHOOK_PUBLIC_KEY before running E2E tests}
      CRON_SECRET: e2e-cron-secret
      LOG_LEVEL: warn
    ports:
      - "3100:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/auth').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
