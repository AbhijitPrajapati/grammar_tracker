[project]
name = "backend"
version = "0.1.0"
description = "Backend for English learning progress tracker"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.140.7",
    "httpx>=0.28.1",
    "openai>=3.2.0",
    "psycopg>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt>=2.13.0",
    "pyrate-limiter>=4.5.0",
    "sqlalchemy>=2.0.51",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Path"]
