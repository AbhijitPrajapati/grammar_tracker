services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grammar_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grammar_tracker}
      POSTGRES_DB: ${POSTGRES_DB:-grammar_tracker}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/local-bootstrap.sql:/docker-entrypoint-initdb.d/001-grammar-tracker-schema.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-grammar_tracker}:${POSTGRES_PASSWORD:-grammar_tracker}@postgres:5432/${POSTGRES_DB:-grammar_tracker}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-5}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-sharing}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-60}
      ANALYZER_MODE: ${ANALYZER_MODE:-deterministic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-60000}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-1}
      ANALYSIS_MINUTE_LIMIT: ${ANALYSIS_MINUTE_LIMIT:-3}
      ANALYSIS_DAY_LIMIT: ${ANALYSIS_DAY_LIMIT:-20}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:?Set UPSTASH_REDIS_REST_URL in the root .env file}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:?Set UPSTASH_REDIS_REST_TOKEN in the root .env file}
      BLOB_STORE_ID: ${BLOB_STORE_ID:?Set BLOB_STORE_ID in the root .env file}
      VERCEL_OIDC_TOKEN: ${VERCEL_OIDC_TOKEN:?Set VERCEL_OIDC_TOKEN in the root .env file}
      BLOB_WEBHOOK_PUBLIC_KEY: ${BLOB_WEBHOOK_PUBLIC_KEY:?Set BLOB_WEBHOOK_PUBLIC_KEY in the root .env file}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/auth').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
