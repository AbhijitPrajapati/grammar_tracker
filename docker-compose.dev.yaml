services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: grammar_tracker
      POSTGRES_PASSWORD: grammar_tracker
      POSTGRES_DB: grammar_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./localdb/bootstrap.sql:/docker-entrypoint-initdb.d/001-grammar-tracker-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
